<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Yes or No</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .image-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      max-width: 80%;
      max-height: 80%;
      border-radius: 12px;
    }

    .buttons {
      margin-bottom: 30px;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      margin: 0 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .yes {
      background-color: #4CAF50;
      color: white;
    }

    .no {
      background-color: #F44336;
      color: white;
    }
  </style>
</head>
<body>

  <div class="image-container">
    <img src="your-image.jpg" alt="Centered Image">
  </div>

  <div class="buttons">
    <button class="yes" onclick="yesClicked()">Yes</button>
    <button class="no" onclick="noClicked()">No</button>
  </div>

  <script>
    function yesClicked() {
      alert("You clicked YES ✅");
    }

    function noClicked() {
      alert("You clicked NO ❌");
    }
  </script>

</body>
</html>
